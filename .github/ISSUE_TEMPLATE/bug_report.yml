name: Bug Report
description: Report a bug, crash, or visual glitch in macOS Dock
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide the system details below to help us reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: dropdown
    id: session_type
    attributes:
      label: Display Server / Session Type
      description: Which session type are you running?
      options:
        - Wayland
        - X11
    validations:
      required: true

  - type: input
    id: plasma_version
    attributes:
      label: KDE Plasma Version
      description: Run `plasmashell --version` in terminal (e.g., 6.3.2, 6.7.5).
      placeholder: e.g. 6.7.5
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux Distribution
      placeholder: e.g. Fedora 43, Arch Linux, Ubuntu 24.10, openSUSE Tumbleweed
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation Method
      description: How did you install the dock?
      options:
        - KDE Store / .plasmoid download (Pure QML mode)
        - Built from source with ./install.sh (C++ KWin blur enabled)
        - Direct git clone into ~/.local/share/plasma/plasmoids
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe the exact steps to reproduce the behavior.
      placeholder: |
        1. Open dock settings...
        2. Set zoom scale to 2.5x...
        3. Move cursor to the far-left icon...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recordings
      description: Drag and drop screenshots or screen recordings here (especially helpful for visual or animation issues!).
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Terminal Output
      description: Paste any output from `journalctl --user-unit=plasma-plasmashell -e --no-pager` or terminal errors.
      render: shell
    validations:
      required: false
